name: Swing Trade Screener (Archiv, nur manuell)

# Zeitplan stillgelegt - die Signaltafel uebernimmt den automatischen Lauf.
# Dieser Workflow bleibt nur noch manuell startbar (Actions -> Run workflow).
on:
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance numpy pandas --quiet

      - name: Screener ausführen
        run: python run_screener_alt.py

      - name: Report auf GitHub veröffentlichen
        run: |
          git config user.name "Screener Bot"
          git config user.email "screener@wortmann-wember.de"
          git add docs/
          git diff --staged --quiet || git commit -m "Report $(date +'%Y-%m-%d %H:%M') UTC"
          git push
